<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5F57">
<title>PIANRAN Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#EEF2F1; --border:#D5DDDB;
  --text:#14201D; --text-2:#4A5754; --primary:#0F5F57; --on-primary:#FFFFFF; --primary-soft:#DDEFEC;
  --done:#1E6B3A; --done-soft:#E3F2E8; --danger:#B42318; --scrim:rgba(10,20,18,.5); --head:#0F5F57;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1513; --surface:#17201E; --surface-2:#1F2A27; --border:#33413D;
  --text:#E6EDEB; --text-2:#A9B7B3; --primary:#6CCFC1; --on-primary:#062420; --primary-soft:#1D3833;
  --done:#7DD69A; --done-soft:#1A2E22; --danger:#FF8A80; --scrim:rgba(0,0,0,.6); --head:#163B36;
  color-scheme:dark;
}}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header{position:sticky;top:0;z-index:10;background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 8px 16px}
.bar-top{display:flex;align-items:center;gap:4px}
.month{flex:1;text-align:center;font-weight:700;font-size:18px;text-transform:capitalize}
.ibtn{width:44px;height:44px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:inherit}
.ibtn:active{background:rgba(255,255,255,.15)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 8px 0}
.sum > button,.sum > div{background:rgba(255,255,255,.12);border:0;border-radius:14px;padding:10px;text-align:left;min-height:64px;color:inherit}
.sum .k{font-size:12px;opacity:.9;display:flex;align-items:center;gap:4px}
.sum .v{font-weight:750;font-size:16px;overflow-wrap:anywhere;white-space:normal;line-height:1.3}
.sum .k .icon{width:14px;height:14px}
.progress{margin:12px 8px 0;font-size:14px}
.track{height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:currentColor;border-radius:9px;transform-origin:left;transition:transform 300ms cubic-bezier(.2,.8,.2,1)}

main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
li{display:flex;align-items:center;border-top:1px solid var(--border)}
li:first-child{border-top:0}
.check{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 4px 8px 14px;border:0;background:none;text-align:left;transition:background 150ms}
.check:active{background:var(--surface-2)}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--text-2);display:grid;place-items:center;flex:none;transition:background 150ms,border-color 150ms}
.box .icon{width:18px;height:18px;stroke-width:3;color:var(--on-primary);opacity:0;transform:scale(.6);transition:opacity 150ms,transform 150ms}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.amt{font-weight:650}
li.done{background:var(--done-soft)}
li.done .box{background:var(--done);border-color:var(--done)}
li.done .box .icon{opacity:1;transform:none}
li.done .name{text-decoration:line-through;color:var(--text-2)}
li.done .amt{color:var(--done)}
.edit{width:48px;height:60px;border:0;background:none;color:var(--text-2);display:grid;place-items:center;flex:none}
.edit .icon{width:18px;height:18px}

.add{width:100%;margin-top:12px;min-height:52px;border:2px dashed var(--border);background:none;border-radius:16px;font-weight:650;color:var(--primary);display:flex;align-items:center;justify-content:center;gap:8px}
.add:active{background:var(--primary-soft)}
.empty{text-align:center;color:var(--text-2);padding:32px 16px}

/* Feuilles */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;border-radius:22px 22px 0 0;background:var(--surface);color:var(--text)}
dialog::backdrop{background:var(--scrim)}
@media (min-width:600px){dialog{margin:auto;border-radius:22px}}
dialog form{padding:16px 20px calc(20px + env(safe-area-inset-bottom))}
dialog h2{margin:0 0 12px;font-size:19px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input{width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-size:18px}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field .err{color:var(--danger);font-size:13px;margin-top:4px}
.field .err:empty{display:none}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.danger{color:var(--danger);background:none}
.menu button{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;border:0;background:none;text-align:left;padding:0 4px;border-radius:10px;font-weight:600}
.menu button:active{background:var(--surface-2)}
.menu .danger{color:var(--danger)}
.menu p{color:var(--text-2);font-size:13px;margin:12px 4px 0}

.toast{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));margin:0 auto;max-width:440px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity 160ms,transform 200ms;z-index:50}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;min-height:40px}
@media (prefers-reduced-motion: reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
</svg>

<header>
  <div class="bar-top">
    <button class="ibtn" id="prev" aria-label="Mois précédent"><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg></button>
    <h1 class="month" id="month" aria-live="polite" style="margin:0"></h1>
    <button class="ibtn" id="next" aria-label="Mois suivant"><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button>
    <button class="ibtn" id="menuBtn" aria-label="Menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
  </div>
  <div class="sum">
    <button id="budgetBtn" aria-label="Modifier le budget du mois"><div class="k">Budget <svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></div><div class="v num" id="vBudget"></div></button>
    <div><div class="k">Total</div><div class="v num" id="vTotal"></div></div>
    <div><div class="k">Reste</div><div class="v num" id="vReste"></div></div>
  </div>
  <div class="progress">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span id="pCount"></span><span class="num" id="pLeft"></span></div>
    <div class="track" aria-hidden="true"><i id="pBar"></i></div>
  </div>
</header>

<main>
  <ul id="list" aria-label="Liste des dépenses du mois"></ul>
  <button class="add" id="addBtn"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Ajouter une ligne</button>
</main>

<!-- Ligne -->
<dialog id="itemDlg" aria-labelledby="itemTitle">
  <form id="itemForm" novalidate>
    <h2 id="itemTitle">Ligne</h2>
    <div class="field"><label for="iName">Nom</label><input id="iName" maxlength="40" autocomplete="off"><div class="err" id="iNameErr" role="alert"></div></div>
    <div class="field"><label for="iAmt">Montant (FCFA)</label><input id="iAmt" inputmode="numeric" autocomplete="off" class="num"><div class="err" id="iAmtErr" role="alert"></div></div>
    <div class="row">
      <button type="button" class="btn danger" id="iDel"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Supprimer</button>
      <button type="button" class="btn" data-close>Annuler</button>
      <button type="submit" class="btn primary">OK</button>
    </div>
  </form>
</dialog>

<!-- Budget -->
<dialog id="budgetDlg" aria-labelledby="budgetTitle">
  <form id="budgetForm" novalidate>
    <h2 id="budgetTitle">Budget du mois</h2>
    <div class="field"><label for="bAmt">Salaire + autres revenus (FCFA)</label><input id="bAmt" inputmode="numeric" autocomplete="off" class="num"></div>
    <div class="row"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">OK</button></div>
  </form>
</dialog>

<!-- Menu -->
<dialog id="menuDlg" aria-labelledby="menuTitle">
  <form method="dialog" class="menu">
    <h2 id="menuTitle">Menu</h2>
    <button type="button" id="mUncheck"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg>Tout décocher ce mois-ci</button>
    <button type="button" id="mExport"><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>Sauvegarder mes données</button>
    <button type="button" id="mImport"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>Restaurer une sauvegarde</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button value="close" class="sr-only">Fermer</button>
    <p>Les données restent sur ce téléphone. Chaque mois a ses propres cases cochées ; la liste des lignes est la même pour tous les mois.</p>
  </form>
</dialog>

<!-- Confirmation -->
<dialog id="confDlg" aria-labelledby="confTitle">
  <form method="dialog">
    <h2 id="confTitle"></h2>
    <p id="confText" style="color:var(--text-2);margin-top:0"></p>
    <div class="row"><button value="no" class="btn">Annuler</button><button value="yes" class="btn primary" id="confYes">Confirmer</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg" style="flex:1"></span><button id="toastBtn" hidden>Annuler</button></div>

<script>
'use strict';
/* ---------- Base IndexedDB ---------- */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('pianran-budget', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('categories')) d.createObjectStore('categories', {keyPath:'id'});
      if (!d.objectStoreNames.contains('transactions')) d.createObjectStore('transactions', {keyPath:'id'});
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'key'});
      if (!d.objectStoreNames.contains('months')) d.createObjectStore('months', {keyPath:'month'});
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function run(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out); t.onerror = () => rej(t.error);
  });
}
const all = s => run(s, 'readonly', st => st.getAll());
const get = (s, k) => run(s, 'readonly', st => st.get(k));
const put = (s, o) => run(s, 'readwrite', st => st.put(o));
const del = (s, k) => run(s, 'readwrite', st => st.delete(k));
const clear = s => run(s, 'readwrite', st => st.clear());

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const nf = new Intl.NumberFormat('fr-FR');
const fmt = n => nf.format(Math.round(n)).replace(/[  ]/g, ' ');
const money = n => fmt(n) + ' F';
const parse = v => Number(String(v).replace(/[^\d]/g, '')) || 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const curMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const shift = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo-1+k, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const label = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo-1, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'}); };
['#iAmt', '#bAmt'].forEach(s => $(s).addEventListener('input', e => { const n = parse(e.target.value); e.target.value = n ? fmt(n) : ''; }));

/* ---------- État ---------- */
const S = { month: curMonth(), items: [], m: null };

async function seed(){
  if (await get('meta', 'seeded')) return;
  const base = [['Nourriture maison',45000],['Sac de riz',14000],['Gaz',5500],['Énergie CIE / SODECI',5000],['Canal+',10200],['Maison',40000],
    ['Transport travail',25000],['Nourriture travail',30000],['Plaquette d’œufs',2500],['Petit-déjeuner',8000],['Madame',10000],
    ['James scolarité',10000],['Petit-déjeuner James',10000],['Cours de renforcement',3000],['Dette ARESO',5050],['Tontine',10100],['Santé',20000],['Épargne',20000]];
  for (let i = 0; i < base.length; i++) await put('categories', {id: uid(), name: base[i][0], planned: base[i][1], order: i});
  await put('meta', {key:'seeded', value:true});
}

async function loadMonth(){
  let m = await get('months', S.month);
  if (!m){
    // budget repris du dernier mois connu, sinon 285 000
    const months = (await all('months')).filter(x => x.month < S.month).sort((a,b) => b.month.localeCompare(a.month));
    m = {month: S.month, budget: months[0] ? months[0].budget : 285000, paid: {}};
  }
  S.m = m;
}
const saveMonth = () => put('months', S.m);

/* ---------- Affichage ---------- */
function render(){
  $('#month').textContent = label(S.month);
  const total = S.items.reduce((s, i) => s + i.planned, 0);
  const done = S.items.filter(i => S.m.paid[i.id]);
  const paid = done.reduce((s, i) => s + i.planned, 0);
  const reste = S.m.budget - total;
  $('#vBudget').textContent = money(S.m.budget);
  $('#vTotal').textContent = money(total);
  $('#vReste').textContent = (reste < 0 ? '−' : '') + money(Math.abs(reste));
  $('#pCount').textContent = `${done.length} / ${S.items.length} payé${done.length > 1 ? 's' : ''} · ${money(paid)}`;
  $('#pLeft').textContent = 'À payer : ' + money(total - paid);
  $('#pBar').style.transform = `scaleX(${total ? paid / total : 0})`;

  $('#list').innerHTML = S.items.length ? S.items.map(i => {
    const ok = !!S.m.paid[i.id];
    return `<li class="${ok ? 'done' : ''}">
      <button class="check" role="checkbox" aria-checked="${ok}" data-id="${i.id}">
        <span class="box" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
        <span class="name">${esc(i.name)}</span><span class="amt num">${fmt(i.planned)}</span>
      </button>
      <button class="edit" data-edit="${i.id}" aria-label="Modifier ${esc(i.name)}"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></button>
    </li>`;
  }).join('') : `<li class="empty" style="display:block">Aucune ligne. Ajoutez vos dépenses du mois.</li>`;
}

/* ---------- Actions ---------- */
$('#list').addEventListener('click', async e => {
  const c = e.target.closest('[data-id]'), ed = e.target.closest('[data-edit]');
  if (c){
    const id = c.dataset.id;
    if (S.m.paid[id]) delete S.m.paid[id]; else S.m.paid[id] = true;
    if (navigator.vibrate) navigator.vibrate(10);
    await saveMonth(); render();
    document.querySelector(`[data-id="${id}"]`)?.focus();
  }
  if (ed) openItem(S.items.find(i => i.id === ed.dataset.edit));
});
$('#prev').onclick = async () => { S.month = shift(S.month, -1); await loadMonth(); render(); };
$('#next').onclick = async () => { S.month = shift(S.month, 1); await loadMonth(); render(); };

let editing = null;
function openItem(it = null){
  editing = it;
  $('#itemTitle').textContent = it ? 'Modifier la ligne' : 'Nouvelle ligne';
  $('#iName').value = it ? it.name : '';
  $('#iAmt').value = it ? fmt(it.planned) : '';
  $('#iDel').hidden = !it;
  $('#iNameErr').textContent = $('#iAmtErr').textContent = '';
  $('#itemDlg').showModal(); setTimeout(() => $('#iName').focus(), 50);
}
$('#addBtn').onclick = () => openItem();
$('#itemForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#iName').value.trim(), planned = parse($('#iAmt').value);
  $('#iNameErr').textContent = name ? '' : 'Donnez un nom.';
  $('#iAmtErr').textContent = planned > 0 ? '' : 'Saisissez un montant.';
  if (!name) return $('#iName').focus();
  if (!planned) return $('#iAmt').focus();
  const it = editing ? {...editing, name, planned} : {id: uid(), name, planned, order: S.items.length ? Math.max(...S.items.map(i => i.order)) + 1 : 0};
  await put('categories', it);
  S.items = S.items.filter(i => i.id !== it.id).concat(it).sort((a,b) => a.order - b.order);
  $('#itemDlg').close(); render(); toast(editing ? 'Ligne modifiée' : 'Ligne ajoutée');
});
$('#iDel').onclick = async () => {
  const it = editing; $('#itemDlg').close();
  await del('categories', it.id);
  S.items = S.items.filter(i => i.id !== it.id); render();
  toast(`« ${it.name} » supprimée`, async () => { await put('categories', it); S.items = S.items.concat(it).sort((a,b) => a.order - b.order); render(); });
};

$('#budgetBtn').onclick = () => { $('#bAmt').value = fmt(S.m.budget); $('#budgetDlg').showModal(); setTimeout(() => $('#bAmt').select(), 50); };
$('#budgetForm').addEventListener('submit', async e => { e.preventDefault(); S.m.budget = parse($('#bAmt').value); await saveMonth(); $('#budgetDlg').close(); render(); });

document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

/* ---------- Menu ---------- */
$('#menuBtn').onclick = () => $('#menuDlg').showModal();
function confirmDlg(title, text, yes){
  return new Promise(res => {
    $('#confTitle').textContent = title; $('#confText').textContent = text; $('#confYes').textContent = yes;
    const d = $('#confDlg'); d.returnValue = '';
    d.addEventListener('close', () => res(d.returnValue === 'yes'), {once:true}); d.showModal();
  });
}
$('#mUncheck').onclick = async () => {
  $('#menuDlg').close();
  const before = {...S.m.paid}; S.m.paid = {}; await saveMonth(); render();
  toast('Tout est décoché', async () => { S.m.paid = before; await saveMonth(); render(); });
};
$('#mExport').onclick = async () => {
  $('#menuDlg').close();
  const data = JSON.stringify({app:'pianran', version:2, items: S.items, months: await all('months')}, null, 2);
  const name = `pianran-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([data], {type:'application/json'});
  try { const f = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], title:name}); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  toast('Sauvegarde créée');
};
$('#mImport').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; $('#menuDlg').close(); if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.months)) throw 0;
    if (!await confirmDlg('Restaurer ?', `${d.items.length} lignes et ${d.months.length} mois remplaceront les données actuelles.`, 'Restaurer')) return;
    await clear('categories'); await clear('months');
    for (const i of d.items) await put('categories', i);
    for (const m of d.months) await put('months', m);
    S.items = (await all('categories')).sort((a,b) => a.order - b.order); await loadMonth(); render(); toast('Données restaurées');
  } catch { toast('Fichier invalide'); }
};

let tt;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; const b = $('#toastBtn'); b.hidden = !undo;
  b.onclick = async () => { $('#toast').classList.remove('show'); await undo(); };
  $('#toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('show'), undo ? 5000 : 2500);
}

/* ---------- Démarrage ---------- */
(async () => {
  try {
    db = await openDB();
    navigator.storage?.persist?.().catch(() => {});
    await seed();
    S.items = (await all('categories')).map(c => ({...c, planned: c.planned || 0})).sort((a,b) => a.order - b.order);
    await loadMonth(); render();
  } catch (e) { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:16px;color:#B42318">Stockage indisponible sur cet appareil.</p>'); }
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
