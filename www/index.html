<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD000">
<title>PIANRAN Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --yellow:#FFD000; --yellow-soft:#FFF4C2; --yellow-line:#E6BC00;
  --bg:#F6F6F2; --white:#FFFFFF; --black:#111111; --text-2:#4D4D4D; --border:#DCDCD4;
  --danger:#B42318; --scrim:rgba(0,0,0,.5);
  color-scheme:light;
}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--black);font:400 16px/1.5 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
:focus-visible{outline:3px solid var(--black);outline-offset:2px;border-radius:8px}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* En-tête jaune, texte noir */
header{position:sticky;top:0;z-index:10;background:var(--yellow);color:var(--black);padding:calc(env(safe-area-inset-top) + 8px) 8px 14px;border-bottom:1px solid var(--yellow-line)}
.bar-top{display:flex;align-items:center;gap:4px}
.month{flex:1;text-align:center;font-weight:800;font-size:19px;text-transform:capitalize;margin:0}
.ibtn{width:44px;height:44px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:inherit}
.ibtn:active{background:rgba(0,0,0,.08)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 8px 0}
.sum > button,.sum > div{background:var(--white);border:1.5px solid var(--black);border-radius:14px;padding:8px 10px;text-align:left;min-height:62px;color:var(--black)}
.sum > button:active{background:var(--yellow-soft)}
.sum .k{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.sum .k .icon{width:14px;height:14px}
.sum .v{font-weight:800;font-size:16px;line-height:1.3;overflow-wrap:anywhere;white-space:normal}
.sum .neg{color:var(--danger)}
.progress{margin:10px 8px 0;font-size:14px;font-weight:600}
.track{height:10px;border-radius:9px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:var(--black);border-radius:9px;transform-origin:left;transition:transform 300ms cubic-bezier(.2,.8,.2,1)}

main{padding:12px 12px calc(32px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

/* Sections */
.group{margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:6px;padding:0 0 6px 4px}
.gtitle{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;border:0;background:none;text-align:left;padding:6px 0;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.3px}
.gtitle .num{font-weight:700;color:var(--text-2);text-transform:none;letter-spacing:0}
.gtitle .icon{width:15px;height:15px;color:var(--text-2);align-self:center}
.gadd{min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--black);background:var(--yellow);font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.gadd .icon{width:16px;height:16px}
.gadd:active{background:var(--yellow-line)}
ul{list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;border-top:1px solid var(--border)}
li:first-child{border-top:0}
.check{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 4px 8px 14px;border:0;background:none;text-align:left}
.check:active{background:#F2F2EC}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--black);display:grid;place-items:center;flex:none;background:var(--white);transition:background 150ms}
.box .icon{width:18px;height:18px;stroke-width:3.2;color:var(--yellow);opacity:0;transform:scale(.6);transition:opacity 150ms,transform 150ms}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.amt{font-weight:700}
li.done{background:var(--yellow-soft)}
li.done .box{background:var(--black)}
li.done .box .icon{opacity:1;transform:none}
li.done .name{text-decoration:line-through;color:var(--text-2)}
.edit{width:48px;height:58px;border:0;background:none;color:var(--text-2);display:grid;place-items:center;flex:none}
.edit .icon{width:19px;height:19px}
.gempty{padding:14px;color:var(--text-2);font-size:14px;display:block}

.bigbtn{width:100%;min-height:52px;border-radius:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.bigbtn.dash{border:2px dashed #BDBDB3;background:none}
.bigbtn.dash:active{background:var(--white)}
.bigbtn.yellow{border:1.5px solid var(--black);background:var(--yellow)}
.bigbtn.yellow:active{background:var(--yellow-line)}
.bigbtn.white{border:1.5px solid var(--black);background:var(--white)}

.start{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px 16px;text-align:center}
.start h2{margin:0 0 4px;font-size:19px}
.start p{margin:0 0 8px;color:var(--text-2)}

/* Feuilles */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;border-radius:22px 22px 0 0;background:var(--white);color:var(--black)}
dialog::backdrop{background:var(--scrim)}
@media (min-width:600px){dialog{margin:auto;border-radius:22px}}
dialog form{padding:18px 20px calc(20px + env(safe-area-inset-bottom))}
dialog h2{margin:0 0 12px;font-size:19px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--white);font-size:18px}
.field input:focus,.field select:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px var(--yellow)}
.field .err{color:var(--danger);font-size:13px;margin-top:4px;font-weight:600}
.field .err:empty{display:none}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;min-height:50px;border-radius:12px;border:1.5px solid var(--black);background:var(--white);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--yellow)}
.btn.primary:active{background:var(--yellow-line)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.menu button{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;border:0;background:none;text-align:left;padding:0 4px;border-radius:10px;font-weight:600}
.menu button:active{background:var(--yellow-soft)}
.menu p{color:var(--text-2);font-size:13px;margin:12px 4px 0}

.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));margin:0 auto;max-width:440px;background:var(--black);color:var(--white);padding:12px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity 160ms,transform 200ms;z-index:50}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:none;color:var(--yellow);font-weight:800;min-height:40px}
.preview{background:var(--yellow-soft);border:1px solid var(--yellow-line);border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-size:14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.preview b{font-weight:800;text-align:right}
.preview .neg{color:var(--danger)}
.inc{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.inc .field{margin:0}
.inc .n{flex:1.3;min-width:0}.inc .a{flex:1;min-width:0}
.inc .field input{font-size:16px}
.inc .del{width:48px;height:52px;border:1.5px solid var(--border);border-radius:12px;background:none;color:var(--danger);display:grid;place-items:center;flex:none}
.linkbtn{border:0;background:none;color:var(--black);font-weight:700;text-decoration:underline;min-height:44px;padding:0;display:flex;align-items:center;gap:6px}
dialog.full{margin:0;max-width:none;width:100%;height:100dvh;max-height:100dvh;border-radius:0}
dialog.full .wrap{display:flex;flex-direction:column;height:100%}
.rhead{background:var(--yellow);padding:calc(env(safe-area-inset-top) + 8px) 8px 10px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--yellow-line)}
.rhead h2{flex:1;margin:0;text-align:center;font-size:18px}
.rbody{flex:1;overflow:auto;padding:14px 12px 24px;background:var(--bg)}
.rbody h3{font-size:15px;text-transform:uppercase;letter-spacing:.3px;margin:18px 4px 8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpis > div{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px}
.kpis .k{font-size:12px;font-weight:600;color:var(--text-2)}.kpis .v{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13px}
.tbl th{background:var(--yellow);text-align:right;padding:8px 6px;font-weight:800}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 6px;border-top:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{white-space:normal;text-transform:capitalize}
.tbl tr.tot td{font-weight:800;background:var(--yellow-soft)}
.tbl .neg{color:var(--danger)}
.tscroll{overflow-x:auto;border-radius:12px}
.rfoot{display:flex;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--white);border-top:1px solid var(--border)}
@media (prefers-reduced-motion: reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17V11M13 17V7M18 17v-4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14h6"/></symbol>
</svg>

<header>
  <div class="bar-top">
    <button class="ibtn" id="prev" aria-label="Mois précédent"><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg></button>
    <h1 class="month" id="month" aria-live="polite"></h1>
    <button class="ibtn" id="next" aria-label="Mois suivant"><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button>
    <button class="ibtn" id="menuBtn" aria-label="Menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
  </div>
  <div class="sum">
    <button id="budgetBtn" aria-label="Voir et modifier les revenus du mois"><div class="k">Revenus <svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></div><div class="v num" id="vBudget"></div></button>
    <div><div class="k">Total</div><div class="v num" id="vTotal"></div></div>
    <div><div class="k">Reste</div><div class="v num" id="vReste"></div></div>
  </div>
  <div class="progress">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span id="pCount"></span><span class="num" id="pLeft"></span></div>
    <div class="track" aria-hidden="true"><i id="pBar"></i></div>
  </div>
</header>

<main id="main"></main>

<!-- Dépense -->
<dialog id="itemDlg" aria-labelledby="itemTitle">
  <form id="itemForm" novalidate>
    <h2 id="itemTitle">Dépense</h2>
    <div class="field"><label for="iName">Nom de la dépense</label><input id="iName" maxlength="40" autocomplete="off"><div class="err" id="iNameErr" role="alert"></div></div>
    <div class="field"><label for="iAmt">Montant (FCFA)</label><input id="iAmt" inputmode="numeric" autocomplete="off" class="num"><div class="err" id="iAmtErr" role="alert"></div></div>
    <div class="preview" id="iPrev" aria-live="polite"></div>
    <div class="field"><label for="iGroup">Catégorie</label><select id="iGroup"></select></div>
    <div class="row">
      <button type="button" class="btn danger" id="iDel"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Supprimer</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
    <div class="row"><button type="button" class="btn" data-close>Annuler</button></div>
  </form>
</dialog>

<!-- Catégorie -->
<dialog id="groupDlg" aria-labelledby="groupTitle">
  <form id="groupForm" novalidate>
    <h2 id="groupTitle">Catégorie</h2>
    <div class="field"><label for="gName">Nom de la catégorie</label><input id="gName" maxlength="30" autocomplete="off"><div class="err" id="gNameErr" role="alert"></div></div>
    <div class="row">
      <button type="button" class="btn danger" id="gDel"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Supprimer</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
    <div class="row"><button type="button" class="btn" data-close>Annuler</button></div>
  </form>
</dialog>

<!-- Revenus -->
<dialog id="incDlg" aria-labelledby="incTitle">
  <form id="incForm" novalidate>
    <h2 id="incTitle">Revenus du mois</h2>
    <div id="incList"></div>
    <button type="button" class="linkbtn" id="incAdd"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Ajouter une source de revenu</button>
    <div class="preview" id="incPrev" aria-live="polite" style="margin-top:10px"></div>
    <div class="row"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>
  </form>
</dialog>

<!-- Rapport annuel -->
<dialog id="repDlg" class="full" aria-labelledby="repTitle">
  <div class="wrap">
    <div class="rhead">
      <button class="ibtn" id="repPrev" aria-label="Année précédente"><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg></button>
      <h2 id="repTitle">Rapport</h2>
      <button class="ibtn" id="repNext" aria-label="Année suivante"><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button>
      <button class="ibtn" data-close aria-label="Fermer le rapport"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="rbody" id="repBody"></div>
    <div class="rfoot">
      <button class="btn" id="repSave"><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>Télécharger</button>
      <button class="btn primary" id="repMail"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Envoyer</button>
    </div>
  </div>
</dialog>

<!-- Menu -->
<dialog id="menuDlg" aria-labelledby="menuTitle">
  <form method="dialog" class="menu">
    <h2 id="menuTitle">Menu</h2>
    <button type="button" id="mReport"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Rapport annuel</button>
    <button type="button" id="mCopy"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span id="mCopyLabel">Reconduire le mois précédent</span></button>
    <button type="button" id="mUncheck"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg>Tout décocher ce mois-ci</button>
    <button type="button" id="mExport"><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>Sauvegarder mes données</button>
    <button type="button" id="mImport"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>Restaurer une sauvegarde</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <div class="row"><button value="close" class="btn" style="justify-content:center">Fermer</button></div>
    <p>Les données restent sur ce téléphone. Chaque mois a sa propre liste.</p>
  </form>
</dialog>

<!-- Confirmation -->
<dialog id="confDlg" aria-labelledby="confTitle">
  <form method="dialog">
    <h2 id="confTitle"></h2>
    <p id="confText" style="color:var(--text-2);margin-top:0"></p>
    <div class="row"><button value="no" class="btn">Annuler</button><button value="yes" class="btn primary" id="confYes">Confirmer</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg" style="flex:1"></span><button id="toastBtn" hidden>Annuler</button></div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script>
'use strict';
/* ---------- IndexedDB ---------- */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('pianran-budget', 3);
    r.onupgradeneeded = () => {
      const d = r.result;
      for (const s of ['categories','transactions','meta','months','groups']){
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath: s === 'meta' ? 'key' : s === 'months' ? 'month' : 'id'});
      }
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function run(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out); t.onerror = () => rej(t.error);
  });
}
const all = s => run(s, 'readonly', st => st.getAll());
const get = (s, k) => run(s, 'readonly', st => st.get(k));
const put = (s, o) => run(s, 'readwrite', st => st.put(o));
const del = (s, k) => run(s, 'readwrite', st => st.delete(k));
const clear = s => run(s, 'readwrite', st => st.clear());

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const nf = new Intl.NumberFormat('fr-FR');
const fmt = n => nf.format(Math.round(n)).replace(/[  ]/g, ' ');
const money = n => fmt(n) + ' F';
const parse = v => Number(String(v).replace(/[^\d]/g, '')) || 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const curMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const shift = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo-1+k, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const label = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo-1, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'}); };
const fmtInput = el => { const n = parse(el.value); el.value = n ? fmt(n) : ''; };
$('#iAmt').addEventListener('input', e => { fmtInput(e.target); itemPreview(); });
const revenue = m => m ? (m.incomes || []).reduce((s, i) => s + i.amount, 0) : 0;
const planned = m => m ? m.items.reduce((s, i) => s + i.amount, 0) : 0;
const signed = n => (n < 0 ? '−' : '') + money(Math.abs(n));
function normalize(m){ if (m && !m.incomes){ m.incomes = [{id: uid(), name: 'Salaire', amount: m.budget ?? 0}]; } if (m) delete m.budget; return m; }

/* ---------- Données par défaut ---------- */
const DEFAULT = [
  ['Nourriture', [['Nourriture maison',45000],['Sac de riz',14000],['Plaquette d’œufs',2500],['Petit-déjeuner',8000]]],
  ['Maison', [['Maison',40000],['Gaz',5500],['Énergie CIE / SODECI',5000],['Canal+',10200]]],

/* ---------- État ---------- */
const S = { month: curMonth(), groups: [], m: null };   // m = {month, budget, items:[{id,name,amount,groupId,paid}]} ou null

async function setup(){
  if (await get('meta', 'v3')) return;
  // création des catégories par défaut
  const groups = DEFAULT.map(([name], i) => ({id: uid(), name, order: i}));
  for (const g of groups) await put('groups', g);
  const groupFor = name => { const k = DEFAULT.findIndex(([, l]) => l.some(([n]) => n === name)); return groups[k >= 0 ? k : 0].id; };
  // reprise des lignes de la version 2 si elles existent
  const old = (await all('categories')).sort((a,b) => a.order - b.order);
  const lines = old.length ? old.map(c => ({name: c.name.replace('Maison (loyer)','Maison'), amount: c.planned || 0, groupId: groupFor(c.name.replace('Maison (loyer)','Maison')), oldId: c.id}))
                           : DEFAULT.flatMap(([, l], k) => l.map(([name, amount]) => ({name, amount, groupId: groups[k].id})));
  const months = await all('months');
  if (!months.some(m => m.month === S.month)) months.push({month: S.month, budget: 285000, paid: {}});
  for (const m of months){
    if (m.items) continue;
    const paid = m.paid || {};
    await put('months', {month: m.month, budget: m.budget ?? 285000, items: lines.map(l => ({id: uid(), name: l.name, amount: l.amount, groupId: l.groupId, paid: !!(l.oldId && paid[l.oldId])}))});
  }
  await put('meta', {key:'v3', value:true});
}
async function loadMonth(){ S.m = normalize((await get('months', S.month)) || null); }
const saveMonth = () => put('months', S.m);
async function previousFilled(){
  const ms = (await all('months')).map(normalize).filter(m => m.month < S.month && m.items && m.items.length).sort((a,b) => b.month.localeCompare(a.month));
  return ms[0] || null;
}

/* ---------- Affichage ---------- */
async function render(){
  $('#month').textContent = label(S.month);
  const items = S.m ? S.m.items : [];
  const total = items.reduce((s, i) => s + i.amount, 0);
  const done = items.filter(i => i.paid), paid = done.reduce((s, i) => s + i.amount, 0);
  const budget = revenue(S.m), reste = budget - total;
  $('#vBudget').textContent = money(budget);
  $('#vTotal').textContent = money(total);
  $('#vReste').textContent = (reste < 0 ? '−' : '') + money(Math.abs(reste));
  $('#vReste').classList.toggle('neg', reste < 0);
  $('#pCount').textContent = `${done.length} / ${items.length} payé${done.length > 1 ? 's' : ''} · ${money(paid)}`;
  $('#pLeft').textContent = 'À payer : ' + money(total - paid);
  $('#pBar').style.transform = `scaleX(${total ? paid / total : 0})`;

  if (!S.m){
    const prev = await previousFilled();
    $('#main').innerHTML = `<div class="start">
      <h2>Nouveau mois</h2>
      <p>${prev ? `Reprendre la liste de ${label(prev.month)} ? Les dépenses et les revenus sont recopiés, toutes les cases sont décochées.` : 'Aucun mois précédent à reprendre.'}</p>
      ${prev ? `<button class="bigbtn yellow" id="copyBtn"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Reconduire ${label(prev.month)}</button>` : ''}
      <button class="bigbtn white" id="blankBtn"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Commencer une liste vide</button></div>`;
    $('#copyBtn')?.addEventListener('click', () => copyFrom(prev));
    $('#blankBtn').onclick = async () => { S.m = {month: S.month, incomes: prev ? prev.incomes.map(i => ({...i, id: uid()})) : [{id: uid(), name: 'Salaire', amount: 0}], items: []}; await saveMonth(); render(); };
    return;
  }

  const known = new Set(S.groups.map(g => g.id));
  const orphans = items.filter(i => !known.has(i.groupId));
  const sections = S.groups.map(g => ({g, list: items.filter(i => i.groupId === g.id)}));
  if (orphans.length) sections.push({g: {id: '', name: 'Sans catégorie'}, list: orphans});
  $('#main').innerHTML = sections.map(({g, list}) => {
    const sub = list.reduce((s, i) => s + i.amount, 0);
    return `<section class="group" aria-label="${esc(g.name)}">
      <div class="ghead">
        ${g.id ? `<button class="gtitle" data-gedit="${g.id}" aria-label="Modifier la catégorie ${esc(g.name)}">${esc(g.name)} <span class="num">${fmt(sub)}</span><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></button>`
               : `<div class="gtitle">${esc(g.name)} <span class="num">${fmt(sub)}</span></div>`}
        <button class="gadd" data-add="${g.id}" aria-label="Ajouter une dépense dans ${esc(g.name)}"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Dépense</button>
      </div>
      <ul>${list.length ? list.map(i => `<li class="${i.paid ? 'done' : ''}">
        <button class="check" role="checkbox" aria-checked="${!!i.paid}" data-id="${i.id}">
          <span class="box" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
          <span class="name">${esc(i.name)}</span><span class="amt num">${fmt(i.amount)}</span></button>
        <button class="edit" data-edit="${i.id}" aria-label="Modifier ou supprimer ${esc(i.name)}"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></button></li>`).join('')
        : `<li><span class="gempty">Aucune dépense dans cette catégorie.</span></li>`}</ul></section>`;
  }).join('') + `<button class="bigbtn dash" id="newGroup"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>Nouvelle catégorie</button>`;
  $('#newGroup').onclick = () => openGroup();
}

/* ---------- Rapport annuel ---------- */
let repYear = Number(S.month.slice(0, 4)), repData = null;
async function buildReport(year){
  const months = (await all('months')).map(normalize).filter(m => m.month.startsWith(year + '-')).sort((a,b) => a.month.localeCompare(b.month));
  const gname = id => (S.groups.find(g => g.id === id) || {name: 'Sans catégorie'}).name;
  const rows = months.map(m => { const r = revenue(m), p = planned(m), pay = m.items.filter(i => i.paid).reduce((s, i) => s + i.amount, 0); return {month: m.month, rev: r, plan: p, paid: pay, reste: r - p}; });
  const sum = k => rows.reduce((s, r) => s + r[k], 0);
  const cats = {}, srcs = {};
  months.forEach(m => {
    m.items.forEach(i => { const n = gname(i.groupId); cats[n] = cats[n] || {plan: 0, paid: 0}; cats[n].plan += i.amount; if (i.paid) cats[n].paid += i.amount; });
    m.incomes.forEach(i => srcs[i.name] = (srcs[i.name] || 0) + i.amount);
  });
  return {year, rows, tot: {rev: sum('rev'), plan: sum('plan'), paid: sum('paid'), reste: sum('reste')},
    cats: Object.entries(cats).sort((a,b) => b[1].plan - a[1].plan), srcs: Object.entries(srcs).sort((a,b) => b[1] - a[1])};
}
const shortMonth = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo-1, 1).toLocaleDateString('fr-FR', {month:'long'}); };
async function showReport(){

        <div><div class="k">Reste cumulé</div><div class="v num ${d.tot.reste < 0 ? 'neg' : ''}" style="${d.tot.reste < 0 ? 'color:var(--danger)' : ''}">${signed(d.tot.reste)}</div></div>

        ${d.rows.map(r => `<tr><td>${shortMonth(r.month)}</td><td>${fmt(r.rev)}</td><td>${fmt(r.plan)}</td><td>${fmt(r.paid)}</td><td class="${r.reste < 0 ? 'neg' : ''}">${r.reste < 0 ? '−' : ''}${fmt(Math.abs(r.reste))}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td>${fmt(d.tot.rev)}</td><td>${fmt(d.tot.plan)}</td><td>${fmt(d.tot.paid)}</td><td>${d.tot.reste < 0 ? '−' : ''}${fmt(Math.abs(d.tot.reste))}</td></tr></tbody></table></div>
      <h3>Par catégorie</h3>

        ${d.cats.map(([n, c]) => `<tr><td style="text-transform:none">${esc(n)}</td><td>${fmt(c.plan)}</td><td>${fmt(c.paid)}</td><td>${d.tot.plan ? Math.round(c.plan / d.tot.plan * 100) : 0} %</td></tr>`).join('')}</tbody></table></div>

        ${d.srcs.map(([n, v]) => `<tr><td style="text-transform:none">${esc(n)}</td><td>${fmt(v)}</td><td>${d.tot.rev ? Math.round(v / d.tot.rev * 100) : 0} %</td></tr>`).join('')}</tbody></table></div>`;

function reportPDF(d){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const n = v => fmt(v), sg = v => (v < 0 ? '-' : '') + fmt(Math.abs(v));
  const head = {fillColor: [255, 208, 0], textColor: [17, 17, 17], fontStyle: 'bold'};
  const ra = {didParseCell: c => { if (c.column.index > 0) c.cell.styles.halign = 'right'; }};
  const foot = {fillColor: [255, 244, 194], textColor: [17, 17, 17], fontStyle: 'bold'};
  doc.setFillColor(255, 208, 0); doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(17, 17, 17); doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
  doc.text('PIANRAN - Rapport annuel ' + d.year, 14, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text('Établi le ' + new Date().toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'}) + ' · montants en FCFA', 14, 25);
  doc.autoTable({...ra, startY: 38, theme: 'grid', headStyles: head, styles: {fontSize: 11, cellPadding: 3},
    head: [['Synthèse ' + d.year, 'Montant']], columnStyles: {1: {halign: 'right', fontStyle: 'bold'}},
    body: [['Revenus de l’année', n(d.tot.rev)], ['Dépenses prévues', n(d.tot.plan)], ['Dépenses payées', n(d.tot.paid)], ['Reste cumulé (revenus - prévu)', sg(d.tot.reste)], ['Mois suivis', String(d.rows.length)]]});
  const right = {1: {halign: 'right'}, 2: {halign: 'right'}, 3: {halign: 'right'}, 4: {halign: 'right'}};
  doc.autoTable({...ra, startY: doc.lastAutoTable.finalY + 8, theme: 'grid', headStyles: head, footStyles: foot, styles: {fontSize: 10}, columnStyles: right,
    head: [['Mois', 'Revenus', 'Prévu', 'Payé', 'Reste']],
    body: d.rows.map(r => [shortMonth(r.month).replace(/^./, c => c.toUpperCase()), n(r.rev), n(r.plan), n(r.paid), sg(r.reste)]),
    foot: [['Total', n(d.tot.rev), n(d.tot.plan), n(d.tot.paid), sg(d.tot.reste)]]});
  doc.autoTable({...ra, startY: doc.lastAutoTable.finalY + 8, theme: 'grid', headStyles: head, styles: {fontSize: 10}, columnStyles: right,
    head: [['Catégorie', 'Prévu', 'Payé', 'Part']],
    body: d.cats.map(([k, c]) => [k, n(c.plan), n(c.paid), (d.tot.plan ? Math.round(c.plan / d.tot.plan * 100) : 0) + ' %'])});
  doc.autoTable({...ra, startY: doc.lastAutoTable.finalY + 8, theme: 'grid', headStyles: head, styles: {fontSize: 10}, columnStyles: right,
    head: [['Source de revenu', 'Montant', 'Part']],
    body: d.srcs.map(([k, v]) => [k, n(v), (d.tot.rev ? Math.round(v / d.tot.rev * 100) : 0) + ' %'])});
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(90); doc.text(`PIANRAN Budget · page ${i}/${pages}`, 105, 290, {align: 'center'}); }
  return doc;
}
// Appels natifs (APK) via le pont Capacitor
const isNative = () => typeof (window.Capacitor && window.Capacitor.nativePromise) === 'function';
const native = (plugin, method, opts) => window.Capacitor.nativePromise(plugin, method, opts);
async function deliver(mode){
  const btn = mode === 'mail' ? $('#repMail') : $('#repSave'); btn.disabled = true;
  try {
    const doc = reportPDF(repData), name = `PIANRAN-rapport-${repData.year}.pdf`;
    const subject = `Rapport budget ${repData.year} - PIANRAN`;
    const text = `Rapport annuel ${repData.year} : revenus ${money(repData.tot.rev)}, dépenses prévues ${money(repData.tot.plan)}, reste ${signed(repData.tot.reste)}.`;
    if (isNative()){
      const data = doc.output('datauristring').split(',')[1];
      if (mode === 'save'){
        try {
          const r = await native('Filesystem', 'writeFile', {path: name, data, directory: 'DOCUMENTS', recursive: true});
          toast('Rapport enregistré dans Documents/' + name);
          return;
        } catch (e) { toast('Enregistrement direct impossible : choisissez où l’enregistrer'); }
      }
      const f = await native('Filesystem', 'writeFile', {path: name, data, directory: 'CACHE'});
      await native('Share', 'share', {title: subject, text, files: [f.uri], dialogTitle: mode === 'mail' ? 'Envoyer le rapport' : 'Enregistrer le rapport'});
      return;
    }
    const blob = doc.output('blob');
    const file = new File([blob], name, {type: 'application/pdf'});
    if (mode === 'mail' && navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: subject, text}); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    if (mode === 'mail'){ setTimeout(() => location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text + '\n\nLe rapport PDF est joint (fichier ' + name + ' téléchargé).')}`, 600); }
    toast('Rapport téléchargé');
  } catch (e) {
    if (!/cancel/i.test(String(e && (e.message || e)))) toast('Échec : ' + (e && e.message ? e.message : 'réessayez'));
  } finally { btn.disabled = false; }
}
$('#repSave').onclick = () => deliver('save');
$('#repMail').onclick = () => deliver('mail');

document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
function confirmDlg(title, text, yes){
  return new Promise(res => {
    $('#confTitle').textContent = title; $('#confText').textContent = text; $('#confYes').textContent = yes;
    const d = $('#confDlg'); d.returnValue = '';
    d.addEventListener('close', () => res(d.returnValue === 'yes'), {once:true}); d.showModal();
  });
}

/* ---------- Menu ---------- */
$('#menuBtn').onclick = () => $('#menuDlg').showModal();
$('#mCopy').onclick = async () => {
  $('#menuDlg').close();
  const prev = await previousFilled();
  if (!prev) return toast('Aucun mois précédent à reprendre');
  if (S.m && S.m.items.length && !await confirmDlg('Reconduire ?', `La liste de ${label(S.month)} sera remplacée par celle de ${label(prev.month)}, cases décochées.`, 'Reconduire')) return;
  const before = S.m; await copyFrom(prev);
  if (before) toast(`${label(prev.month)} reconduit`, async () => { S.m = before; await saveMonth(); render(); });
};
$('#mUncheck').onclick = async () => {
  $('#menuDlg').close(); if (!S.m) return;
  const before = S.m.items.map(i => i.paid); S.m.items.forEach(i => i.paid = false); await saveMonth(); render();
  toast('Tout est décoché', async () => { S.m.items.forEach((i, k) => i.paid = before[k]); await saveMonth(); render(); });
};
$('#mExport').onclick = async () => {
  $('#menuDlg').close();
  const data = JSON.stringify({app:'pianran', version:3, groups: S.groups, months: await all('months')}, null, 2);
  const name = `pianran-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([data], {type:'application/json'});
  try { const f = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], title:name}); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  toast('Sauvegarde créée');
};
$('#mImport').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; $('#menuDlg').close(); if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.groups) || !Array.isArray(d.months)) throw 0;
    if (!await confirmDlg('Restaurer ?', `${d.groups.length} catégories et ${d.months.length} mois remplaceront les données actuelles.`, 'Restaurer')) return;
    await clear('groups'); await clear('months');
    for (const g of d.groups) await put('groups', g);
    for (const m of d.months) await put('months', m);
    S.groups = (await all('groups')).sort((a,b) => a.order - b.order); await loadMonth(); render(); toast('Données restaurées');
  } catch { toast('Fichier invalide'); }
};

let tt;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; const b = $('#toastBtn'); b.hidden = !undo;
  b.onclick = async () => { $('#toast').classList.remove('show'); await undo(); };
  $('#toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('show'), undo ? 5000 : 2500);
}

/* ---------- Démarrage ---------- */
(async () => {
  try {
    db = await openDB();
    navigator.storage?.persist?.().catch(() => {});
    await setup();
    S.groups = (await all('groups')).sort((a,b) => a.order - b.order);
    await loadMonth(); await render();
  } catch (e) { console.error(e); document.body.insertAdjacentHTML('afterbegin', '<p style="padding:16px;color:#B42318">Stockage indisponible sur cet appareil.</p>'); }
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
