name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: SDK Android préinstallé
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      - run: npm install
      - run: npx cap add android
      - name: Icônes de l'app
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#FFD000' --splashBackgroundColor '#FFD000'
      - name: Permission d'écriture (Android 9-10)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"#' $M
          grep -n "WRITE_EXTERNAL\|requestLegacy" $M
      - run: npx cap sync android
      - name: Compiler l'APK
        run: |
          cd android && chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon > ../gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -A12 -E "What went wrong|FAILURE|error:" ../gradle.log | head -60 | sed 's/%/%25/g' | tr '\n' '|' | sed 's/^/::error title=Gradle::/' ; echo
            tail -30 ../gradle.log
          fi
          exit $code
      - uses: actions/upload-artifact@v5
        with:
          name: PIANRAN-Budget-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Déposer l'APK sur la branche apk
        run: |
          mkdir out && cp android/app/build/outputs/apk/debug/app-debug.apk out/PIANRAN-Budget.apk
          cd out
          echo "Build ${GITHUB_SHA::7} du $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
