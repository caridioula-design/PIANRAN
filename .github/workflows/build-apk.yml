name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: SDK Android préinstallé
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      - run: npm install
      - run: npx cap add android
      - name: Icônes de l'app
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets
          cp www/icons/icon-512.png assets/icon-only.png
          cp www/icons/maskable-512.png assets/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0F5F57' --splashBackgroundColor '#0F5F57' || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: PIANRAN-Budget-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
